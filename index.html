<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rep Performance Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0B09; --panel:#171310; --panel-2:#1F1A15; --border:#2C2620;
    --text:#F5F1E8; --text-dim:#9C9488; --text-faint:#635B4E;
    --gold:#D9A441; --gold-bg:#2E2311;
    --green:#8FD14F; --green-bg:#1D2712;
    --red:#DC5B4E; --red-bg:#2B1512;
    --blue:#6FA8E8; --blue-bg:#131E30;
    --silver:#C7C7C7; --bronze:#C97B4A; --bronze-bg:#2E1D10; --radius:14px;
    --premier:#C77DFF; --premier-bg:#241A33;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:32px 24px 64px;min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:42px;letter-spacing:0.5px;margin:0 0 6px;text-transform:uppercase;color:var(--text);}
  .sub{color:var(--text-dim);font-size:13px;margin:0;}
  .status-pill{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:10px 18px;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .status-text .l1{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}
  .status-text .l2{font-size:13px;color:var(--text);font-weight:700;}
  .btns{display:flex;gap:8px;}
  button{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;transition:transform .1s,border-color .15s,background .15s;}
  button:hover{border-color:var(--text-faint);background:var(--panel-2);}
  button:active{transform:scale(0.97);}
  button.primary{background:var(--gold);border-color:var(--gold);color:#241C0C;}
  button.primary:hover{background:#E6B85C;}
  .icon-btn{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text);}
  .icon-btn:hover{color:var(--gold);border-color:var(--gold);}
  .icon-btn.spinning svg{animation:spin 0.9s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .tab{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:0.5px;text-transform:uppercase;padding:10px 20px;color:var(--text-dim);cursor:pointer;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px;}
  .stat .lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;}
  .stat .val{font-family:'Anton',sans-serif;font-size:38px;font-weight:400;color:var(--text);line-height:1;}
  .controls{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  input[type=text],select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;}
  select{cursor:pointer;}
  .viewtoggle{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .viewtoggle span{padding:5px 12px;font-size:12px;border-radius:6px;cursor:pointer;color:var(--text-dim);}
  .viewtoggle span.active{background:var(--panel);color:var(--text);}
  .empty{text-align:center;padding:60px 20px;background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);color:var(--text-dim);}
  .empty button{margin-top:14px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius);padding:16px 18px;transition:border-color .12s;}
  .card:hover{border-color:var(--text-faint);}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .name{font-family:'Inter',sans-serif;font-size:17px;font-weight:700;letter-spacing:0.1px;}
  .badge{font-size:13px;font-weight:800;padding:6px 14px;border-radius:20px;letter-spacing:0.5px;text-transform:uppercase;}
  .b-gold{background:var(--gold-bg);color:var(--gold);}
  .b-premier{background:var(--premier-bg);color:var(--premier);}
  .b-silver{background:var(--panel-2);color:var(--silver);}
  .b-blue{background:var(--blue-bg);color:var(--blue);}
  .b-red{background:var(--red-bg);color:var(--red);}
  .b-neutral{background:var(--panel-2);color:var(--text-dim);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:12px;font-size:12px;}
  .detail{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:5px 0;}
  .detail .k{color:var(--text-dim);}
  .detail .v{font-family:'JetBrains Mono',monospace;font-weight:500;}
  .ladder{margin-top:10px;}
  .ladder-row{display:flex;gap:6px;margin-bottom:6px;}
  .chip{flex:1;font-size:11px;padding:6px 8px;border-radius:6px;text-align:center;font-family:'JetBrains Mono',monospace;}
  .chip-done{background:var(--green-bg);color:var(--green);font-weight:800;}
  .chip-pending{background:var(--gold-bg);color:var(--gold);}
  .chip-na{background:var(--panel-2);color:var(--text-faint);}
  .chip-label{font-size:9px;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-faint);margin-bottom:4px;text-align:center;}
  .ratios{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .ratio{background:var(--panel-2);border-radius:6px;padding:6px 10px;font-size:11px;}
  .ratio .rk{color:var(--text-dim);margin-right:6px;}
  .ratio .rv{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{color:var(--text-dim);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:0.4px;}
  td{font-family:'JetBrains Mono',monospace;}
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;width:100%;max-width:640px;}
  .modal h3{font-family:'Inter',sans-serif;font-weight:700;margin:0 0 6px;text-transform:uppercase;font-size:16px;letter-spacing:0.3px;}
  .modal p{color:var(--text-dim);font-size:12px;margin:0 0 14px;}
  textarea{width:100%;min-height:180px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px;resize:vertical;}
  .modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .hidden{display:none;}
  .errmsg{color:var(--red);font-size:12px;margin-top:8px;}
  .banner{font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:16px;}
  .banner-warn{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold);}
  .banner-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .kpi-label{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;letter-spacing:0.5px;color:var(--gold);margin-bottom:10px;}
  .kpi-nums{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;}
  .kpi-actual{font-family:'Anton',sans-serif;font-size:32px;font-weight:400;}
  .kpi-target{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text-dim);}
  .pbar{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-bottom:10px;}
  .pbar-fill{height:100%;background:var(--gold);}
  .kpi-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);}
  .kpi-meta b{color:var(--text);font-family:'JetBrains Mono',monospace;}
  .small-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px;}
  .small-kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .small-kpi .lbl{font-size:11px;color:var(--text-dim);margin-bottom:4px;}
  .small-kpi .val{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="display:flex;align-items:center;gap:16px;">
      <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22,6 L54,6 L54,22 L68,22 L68,8 L92,8 L92,34 L82,34 L82,44 L74,52 L76,62 L68,66 L66,78 L58,92 L48,88 L44,80 L36,80 L30,72 L32,64 L22,58 L14,58 L10,46 L18,38 L18,28 L22,28 Z" fill="var(--gold)"/>
      </svg>
      <div>
        <h1>Rep Performance Board</h1>
        <p class="sub">SRA/CAP/IC production by rep · Team Board</p>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text">
          <div class="l1">Data status</div>
          <div class="l2" id="lastUpdated">Loading...</div>
        </div>
      </div>
      <div class="btns">
        <button id="refreshBtn" class="icon-btn" title="Refresh from sheet" aria-label="Refresh from sheet">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4V9H4.58152M19.9381 11C19.446 7.05369 16.0796 4 12 4C8.64262 4 5.76829 6.06817 4.58152 9M4.58152 9H9M20 20V15H19.4185M19.4185 15C18.2317 17.9318 15.3574 20 12 20C7.92038 20 4.55399 16.9463 4.06189 13M19.4185 15H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="tab1">Reps</div>
    <div class="tab" data-tab="tab2">Team overview</div>
  </div>

  <div id="fetchBanner"></div>
  <div id="statsRow" class="stats hidden"></div>
  <div id="controlsRow" class="controls hidden">
    <input type="text" id="search" placeholder="Search rep name...">
    <select id="sortBy"></select>
    <div class="viewtoggle">
      <span data-view="cards" class="active">Cards</span>
      <span data-view="table">Table</span>
    </div>
  </div>

  <div id="content"></div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modalTitle">Paste data</h3>
    <p>Paste rows copied from Google Sheets (include the header row), or paste raw CSV text.</p>
    <textarea id="pasteArea" placeholder="Rep Name&#9;QTR Status&#9;..."></textarea>
    <div id="modalErr" class="errmsg hidden"></div>
    <div class="modal-btns">
      <button id="cancelBtn">Cancel</button>
      <button id="saveBtn" class="primary">Save data</button>
    </div>
  </div>
</div>

function loadViaJsonp(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = '__jsonp_cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => {
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = (data) => {
      if(done) return;
      done = true;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if(done) return;
      done = true;
      cleanup();
      reject(new Error('JSONP script load failed'));
    };
    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName + '&_ts=' + Date.now();
    document.body.appendChild(script);
    setTimeout(() => {
      if(done) return;
      done = true;
      cleanup();
      reject(new Error('JSONP timed out'));
    }, timeoutMs || 8000);
  });
}

function sheetRowsToTSV(rows){
  return rows.map(row => row.map(cell => {
    let s = (cell === null || cell === undefined) ? '' : String(cell);
    if(s.includes('\t') || s.includes('"') || s.includes('\n')){
      s = '"' + s.replace(/"/g,'""') + '"';
    }
    return s;
  }).join('\t')).join('\n');
}

function applyHiddenColumns(parsed){
  if(!parsed) return parsed;
  const hiddenSet = new Set(HIDDEN_COLUMNS.map(h => h.toLowerCase()));
  const headers = parsed.headers
    .filter(h => !hiddenSet.has(h.toLowerCase()))
    .map(h => HEADER_RENAMES[h.toLowerCase()] || h);
  const originalHeaders = parsed.headers.filter(h => !hiddenSet.has(h.toLowerCase()));
  const rows = parsed.rows.map(row => {
    const obj = {};
    headers.forEach((h, idx) => obj[h] = row[originalHeaders[idx]]);
    return obj;
  });
  return { headers, rows };
}

function parseDelimitedLine(line, delim){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQ){
      if(c === '"'){
        if(line[i+1] === '"'){ cur+='"'; i++; } else { inQ=false; }
      } else cur+=c;
    } else {
      if(c === '"') inQ=true;
      else if(c === delim){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}

function parseRows(text){
  const lines = text.split(/\r?\n/);
  const sample = lines.slice(0,5).join('\n');
  const delim = sample.includes('\t') ? '\t' : ',';
  return lines.map(l => parseDelimitedLine(l, delim));
}

function firstNonEmptyIndex(row){
  for(let i=0;i<row.length;i++){ if(row[i] && row[i].trim()) return i; }
  return -1;
}

function parseRepTable(text){
  const rows = parseRows(text);
  const headerIdx = rows.findIndex(r => r.some(c => c.trim().toLowerCase() === 'rep name'));
  if(headerIdx === -1) return null;
  const rawHeaders = rows[headerIdx];
  const nameColIdx = rawHeaders.findIndex(c => c.trim().toLowerCase() === 'rep name');
  const validCols = rawHeaders.map((h,i) => ({h: h.trim(), i})).filter(x => x.h.length);
  const headers = validCols.map(x => x.h);
  const dataRows = [];
  for(let r = headerIdx+1; r < rows.length; r++){
    const row = rows[r];
    if(!row[nameColIdx] || !row[nameColIdx].trim()) break;
    const obj = {};
    validCols.forEach(x => obj[x.h] = (row[x.i] !== undefined ? row[x.i] : ''));
    dataRows.push(obj);
  }
  if(!dataRows.length) return null;
  return { headers, rows: dataRows };
}

function findLabelRow(rows, label){
  for(const row of rows){
    const i = firstNonEmptyIndex(row);
    if(i >= 0 && row[i].trim().toLowerCase() === label.toLowerCase()) return {row, i};
  }
  return null;
}

function findLabelRowAnywhere(rows, label){
  for(const row of rows){
    const i = row.findIndex(c => c.trim().toLowerCase() === label.toLowerCase());
    if(i >= 0) return {row, i};
  }
  return null;
}

  let totalDays = null;
  outer:
  for(const row of rows){
    for(let i=0;i<row.length;i++){
      if(row[i] && /days in the qrt/i.test(row[i])){
        for(let j=i+1;j<row.length;j++){
          if(row[j] && row[j].trim() !== ''){
            const n = parseFloat(row[j]);
            if(!isNaN(n)){ totalDays = n; break outer; }
          }
        }
      }
    }
  }
  const daysRemaining = metrics.length ? parseFloat(metrics[0].daysRemaining) : NaN;
  const daysElapsed = (totalDays !== null && !isNaN(daysRemaining)) ? (totalDays - daysRemaining) : null;

  if(!metrics.length && !secondary.length && !tiers.length) return null;
  return { metrics, secondary, ratios, tiers, totalDays, daysElapsed };
}

async function tryLiveFetch(){
  const banner = document.getElementById('fetchBanner');
  let jsonpError = null;

  try{
    const data = await loadViaJsonp(APPS_SCRIPT_URL, 45000);
    if(data && data.tab1 && data.tab2){
      const tab1Text = sheetRowsToTSV(data.tab1);
      const tab2Text = sheetRowsToTSV(data.tab2);
      const parsed1 = applyHiddenColumns(parseRepTable(tab1Text));
      const parsed2 = parseTeamSummary(tab2Text);
      let ok1 = false, ok2 = false;
      if(parsed1){ await saveData('tab1', parsed1); fetchStatus.tab1 = 'ok'; ok1 = true; }
      if(parsed2){ await saveData('tab2', parsed2); fetchStatus.tab2 = 'ok'; ok2 = true; }
      if(ok1 || ok2){
        banner.innerHTML = '';
        document.getElementById('statusDot').style.background = (ok1 && ok2) ? 'var(--green)' : 'var(--gold)';
        return;
      } else {
        jsonpError = 'Apps Script responded, but the data inside it could not be parsed into rep/team tables.';
      }
    } else {
      jsonpError = 'Apps Script responded, but not with the expected {tab1, tab2} format. Got: ' + JSON.stringify(data).slice(0,200);
    }
  }catch(e){
    jsonpError = 'Apps Script request failed: ' + e.message;
  }
  console.warn('Live fetch (Apps Script) issue:', jsonpError);
  banner.innerHTML = '<div class="banner banner-warn">Live fetch didn\'t work this time: ' + jsonpError + ' — showing last saved data. Click refresh to try again.</div>';
  document.getElementById('statusDot').style.background = 'var(--gold)';
}

async function loadCached(){
  for(const key of ['tab1','tab2']){
    try{
      const value = await storageGetRaw(key);
      if(value) store[key] = JSON.parse(value);
    }catch(e){ store[key] = store[key] || null; }
  }
  if(!store.tab1 && typeof SEED_TAB1 !== 'undefined') store.tab1 = SEED_TAB1;
  if(!store.tab2 && typeof SEED_TAB2 !== 'undefined') store.tab2 = SEED_TAB2;
  if(store.tab1) store.tab1 = applyHiddenColumns(store.tab1);
}

async function storageGetRaw(key){
  if(window.storage){
    try{
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}

async function saveData(key, parsed){
  const json = JSON.stringify(parsed);
  if(window.storage){
    try{ await window.storage.set(key, json, false); }
    catch(e){ try{ localStorage.setItem(key, json); }catch(e2){} }
  } else {
    try{ localStorage.setItem(key, json); }catch(e){}
  }
  store[key] = parsed;
}

function isEmptyVal(v){ return !v || v === '#N/A' || v.trim() === ''; }
function isAchieved(v){ return /not needed/i.test(v) || /^-\s*\.0$/.test(v.trim()); }

function classify(headers){
  const nameCol = headers.find(h => /name/i.test(h)) || headers[0];
  const statusCols = headers.filter(h => /status/i.test(h));
  const neededCols = headers.filter(h => /need/i.test(h) || /to hit/i.test(h));
  const ratioCols = headers.filter(h => /ratio/i.test(h) || /\//.test(h));
  const used = new Set([nameCol, ...statusCols, ...neededCols, ...ratioCols]);
  const restCols = headers.filter(h => !used.has(h) && h.trim().length);
  return { nameCol, statusCols, neededCols, ratioCols, restCols };
}

function statusBadgeClass(val){
  if(!val) return 'b-neutral';
  if(/premier/i.test(val)) return 'b-premier';
  if(/level\s*3/i.test(val)) return 'b-gold';
  if(/level\s*2/i.test(val) || /core/i.test(val)) return 'b-silver';
  if(/level\s*1/i.test(val) || /club/i.test(val) || /base/i.test(val)) return 'b-blue';
  if(/underperform/i.test(val)) return 'b-red';
  return 'b-neutral';
}

const LEVEL1_SRA_STRONG_THRESHOLD = 5;

function hasAnySRA(row, headers){
  const sraQtrCol = headers.find(h => /^sra qtr$/i.test(h));
  if(!sraQtrCol) return true;
  return (parseFloat(row[sraQtrCol]) || 0) > 0;
}

function getQualifyingRows(parsed){
  return parsed.rows.filter(r => hasAnySRA(r, parsed.headers));
}

function countPacingForLevel1(parsed){
  const { statusCols } = classify(parsed.headers);
  const statusCol = statusCols.find(c => /qtr/i.test(c)) || statusCols[0];
  const clubCol = parsed.headers.find(h => /count.*towards.*level.*1/i.test(h));
  const sraQtrCol = parsed.headers.find(h => /^sra qtr$/i.test(h));
  const icNeededCol = parsed.headers.find(h => /ic needed to hit level 1/i.test(h));
  if(!clubCol || !sraQtrCol) return null;

  let count = 0;
  getQualifyingRows(parsed).forEach(r => {
    const club = (r[clubCol]||'').trim().toUpperCase();
    if(club !== 'Y') return;
    const status = statusCol ? (r[statusCol]||'') : '';
    const alreadyLevel1Plus = /level\s*1|level\s*2|level\s*3|premier/i.test(status);
    if(alreadyLevel1Plus) return;

    const sraQtr = parseFloat(r[sraQtrCol]) || 0;
    const sraStrong = sraQtr > LEVEL1_SRA_STRONG_THRESHOLD;
    const installsMet = icNeededCol ? isAchieved(r[icNeededCol] || '') : false;

    if(sraStrong || installsMet) count++;
  });
  return count;
}

function renderStats(parsed){
  const statsRow = document.getElementById('statsRow');
  if(!parsed){ statsRow.classList.add('hidden'); return; }
  const { statusCols } = classify(parsed.headers);
  const qualifyingRows = getQualifyingRows(parsed);
  const total = qualifyingRows.length;
  const statusCol = statusCols.find(c => /qtr/i.test(c)) || statusCols[0];
  let premier=0, level3=0, level2=0, level1=0;
  if(statusCol){
    qualifyingRows.forEach(r => {
      const v = r[statusCol] || '';
      if(/premier/i.test(v)) premier++;
      else if(/level\s*3/i.test(v)) level3++;
      else if(/level\s*2/i.test(v)) level2++;
      else if(/level\s*1/i.test(v)) level1++;
    });
  }
  const pacingCount = countPacingForLevel1(parsed);
  const pacingTile = pacingCount === null
    ? `<div class="stat" style="border-top-color:var(--green)"><div class="lbl">Pacing for Level 1</div><div class="val" style="color:var(--text-faint);font-size:22px">&mdash;</div></div>`
    : `<div class="stat" style="border-top-color:var(--green)"><div class="lbl">Pacing for Level 1</div><div class="val" style="color:var(--green)">+${pacingCount}</div></div>`;
  statsRow.innerHTML = `
    <div class="stat"><div class="lbl">Total reps</div><div class="val">${total}</div></div>
    <div class="stat" style="border-top-color:var(--premier)"><div class="lbl">Premier</div><div class="val" style="color:var(--premier)">${premier}</div></div>
    <div class="stat" style="border-top-color:var(--gold)"><div class="lbl">Level 3</div><div class="val" style="color:var(--gold)">${level3}</div></div>
    <div class="stat" style="border-top-color:var(--silver)"><div class="lbl">Level 2</div><div class="val" style="color:var(--silver)">${level2}</div></div>
    <div class="stat" style="border-top-color:var(--blue)"><div class="lbl">Level 1</div><div class="val" style="color:var(--blue)">${level1}</div></div>
    ${pacingTile}
  `;
  statsRow.classList.remove('hidden');
}

function renderControls(parsed){
  const controlsRow = document.getElementById('controlsRow');
  const sortSel = document.getElementById('sortBy');
  if(!parsed){ controlsRow.classList.add('hidden'); return; }
  const currentValue = sortSel.value;
  sortSel.innerHTML = parsed.headers.map(h => `<option value="${h}">Sort: ${h}</option>`).join('');
  if(currentValue && parsed.headers.includes(currentValue)){
    sortSel.value = currentValue;
  } else {
    const { statusCols } = classify(parsed.headers);
    const qtrCol = statusCols.find(c => /qtr/i.test(c));
    if(qtrCol) sortSel.value = qtrCol;
  }
  controlsRow.classList.remove('hidden');
}

function buildLadder(neededCols, row){
  if(!neededCols.length) return '';
  let groupSize = neededCols.length % 3 === 0 ? 3 : neededCols.length;
  const rowsOut = [];
  for(let i=0;i<neededCols.length;i+=groupSize) rowsOut.push(neededCols.slice(i,i+groupSize));
  let html = '<div class="ladder">';
  rowsOut.forEach((group, idx) => {
    html += `<div class="chip-label">${groupSize===3 ? 'Tier '+(idx+1) : ''}</div><div class="ladder-row">`;
    group.forEach(col => {
      const val = row[col] || '';
      const shortLabel = col.replace(/needed to hit|to hit/i,'').trim().slice(0,14);
      if(isEmptyVal(val)) html += `<div class="chip chip-na">${shortLabel||col}<br>&mdash;</div>`;
      else if(isAchieved(val)) html += `<div class="chip chip-done">${shortLabel||col}<br>Achieved</div>`;
      else html += `<div class="chip chip-pending">${shortLabel||col}<br>${val} more</div>`;
    });
    html += '</div>';
  });
  return html + '</div>';
}

function statusRank(v){
  if(!v) return 99;
  const s = v.toLowerCase();
  if(/premier/.test(s)) return 0;
  if(/level\s*3/.test(s)) return 1;
  if(/level\s*2/.test(s)) return 2;
  if(/level\s*1/.test(s)) return 3;
  return 4;
}

function ynRank(v){
  if(!v) return 2;
  const s = v.trim().toUpperCase();
  if(s === 'Y') return 0;
  if(s === 'N') return 1;
  return 2;
}

function filterAndSort(parsed){
  const { nameCol, statusCols } = classify(parsed.headers);
  const search = document.getElementById('search').value.trim().toLowerCase();
  const sortBy = document.getElementById('sortBy').value || nameCol;
  let rows = getQualifyingRows(parsed);
  if(search) rows = rows.filter(r => (r[nameCol]||'').toLowerCase().includes(search));
  const isStatusCol = statusCols.includes(sortBy) && /qtr/i.test(sortBy);
  const isYNCol = /count.*towards.*level.*1/i.test(sortBy);

  const sraNeededCol = parsed.headers.find(h => /sra needed to hit level 1/i.test(h));
  const icNeededCol = parsed.headers.find(h => /ic needed to hit level 1/i.test(h));
  const clubColForTiebreak = parsed.headers.find(h => /count.*towards.*level.*1/i.test(h));
  function combinedStatusRank(row){
    const base = statusRank(row[sortBy]);
    if(base <= 3) return base; // Premier/L3/L2/L1 keep their own rank
    const sraDone = sraNeededCol ? isAchieved(row[sraNeededCol] || '') : false;
    const icDone = icNeededCol ? isAchieved(row[icNeededCol] || '') : false;
    if(sraDone || icDone) return 4; // "not needed" reps rank right after the levels
    return 5; // everyone else
  }

  rows.sort((a,b) => {
    if(isStatusCol){
      const diff = combinedStatusRank(a) - combinedStatusRank(b);
      if(diff !== 0) return diff;
      if(clubColForTiebreak){
        const ynDiff = ynRank(a[clubColForTiebreak]) - ynRank(b[clubColForTiebreak]);
        if(ynDiff !== 0) return ynDiff;
      }
      return (a[nameCol]||'').localeCompare(b[nameCol]||'');
    }
    if(isYNCol){
      const diff = ynRank(a[sortBy]) - ynRank(b[sortBy]);
      if(diff !== 0) return diff;
      const qtrCol = statusCols.find(c => /qtr/i.test(c));
      const aTier = qtrCol ? statusRank(a[qtrCol]) : 4;
      const bTier = qtrCol ? statusRank(b[qtrCol]) : 4;
      const aTierCapped = Math.min(aTier, 4);
      const bTierCapped = Math.min(bTier, 4);
      if(aTierCapped !== bTierCapped) return aTierCapped - bTierCapped;
      const aNotNeeded = (sraNeededCol && isAchieved(a[sraNeededCol]||'')) || (icNeededCol && isAchieved(a[icNeededCol]||'')) ? 0 : 1;
      const bNotNeeded = (sraNeededCol && isAchieved(b[sraNeededCol]||'')) || (icNeededCol && isAchieved(b[icNeededCol]||'')) ? 0 : 1;
      if(aNotNeeded !== bNotNeeded) return aNotNeeded - bNotNeeded;
      const sraQtrCol = parsed.headers.find(h => /^sra qtr$/i.test(h));
      const aSra = sraQtrCol ? (parseFloat(a[sraQtrCol]) || 0) : 0;
      const bSra = sraQtrCol ? (parseFloat(b[sraQtrCol]) || 0) : 0;
      if(aSra !== bSra) return bSra - aSra;
      return (a[nameCol]||'').localeCompare(b[nameCol]||'');
    }
    const av=a[sortBy]||'', bv=b[sortBy]||'';
    const an=parseFloat(av), bn=parseFloat(bv);
    if(!isNaN(an) && !isNaN(bn)) return bn-an;
    return av.localeCompare(bv);
  });
  return rows;
}

function renderCards(parsed){
  const { nameCol, statusCols, neededCols, ratioCols, restCols } = classify(parsed.headers);
  const rows = filterAndSort(parsed);
  if(!rows.length) return `<div class="empty">No reps match your search.</div>`;
  return `<div class="cards">` + rows.map(row => {
    const name = row[nameCol] || 'Unnamed';
    const statusCol = statusCols.find(c => /qtr/i.test(c)) || statusCols[0];
    const borderColor = statusCol ? statusColorVar(row[statusCol]) : 'var(--border)';
    const statusBadges = statusCols.map(sc => {
      const v = row[sc];
      return isEmptyVal(v) ? '' : `<span class="badge ${statusBadgeClass(v)}">${v}</span>`;
    }).join(' ');
    const details = restCols.map(col => `<div class="detail"><span class="k">${col}</span><span class="v">${isEmptyVal(row[col])?'&mdash;':row[col]}</span></div>`).join('');
    const ratios = ratioCols.map(col => `<div class="ratio"><span class="rk">${col}</span><span class="rv">${isEmptyVal(row[col])?'&mdash;':row[col]}</span></div>`).join('');
    return `<div class="card" style="border-left-color:${borderColor}">
      <div class="card-head"><div class="name">${name}</div><div>${statusBadges}</div></div>
      <div class="detail-grid">${details}</div>
      ${buildLadder(neededCols, row)}
      <div class="ratios">${ratios}</div>
    </div>`;
  }).join('') + `</div>`;
}

function statusColorVar(val){
  const cls = statusBadgeClass(val);
  const map = {
    'b-premier': 'var(--premier)',
    'b-gold': 'var(--gold)',
    'b-silver': 'var(--silver)',
    'b-blue': 'var(--blue)',
    'b-red': 'var(--red)',
    'b-neutral': 'var(--text-dim)'
  };
  return map[cls] || 'var(--text-dim)';
}

function renderTable(parsed){
  const { statusCols, neededCols } = classify(parsed.headers);
  const rows = filterAndSort(parsed);
  if(!rows.length) return `<div class="empty">No reps match your search.</div>`;
  const headers = parsed.headers;
  return `<div class="tablewrap"><table>
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>{
      const statusCol = statusCols.find(c=>/qtr/i.test(c)) || statusCols[0];
      const borderColor = statusCol ? statusColorVar(r[statusCol]) : 'transparent';
      return `<tr style="border-left:4px solid ${borderColor}">${headers.map(h => {
        const v = r[h];
        if(statusCols.includes(h) && !isEmptyVal(v)){
          return `<td><span style="color:${statusColorVar(v)};font-weight:800;font-size:13px">${v}</span></td>`;
        }
        if(neededCols.includes(h) && !isEmptyVal(v) && isAchieved(v)){
          return `<td><span style="color:var(--green);font-weight:800">${v}</span></td>`;
        }
        return `<td>${isEmptyVal(v)?'&mdash;':v}</td>`;
      }).join('')}</tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function pct(v){
  const n = parseFloat(v);
  if(isNaN(n)) return 0;
  return v.includes('%') ? n : n*100;
}

function buildKpiCard(label, actual, target, meta){
  const targetNum = parseFloat(target)||0;
  const actualNum = parseFloat(actual)||0;
  const width = targetNum > 0 ? Math.min(100, (actualNum/targetNum)*100) : 0;
  const metaHtml = meta.map(m => `<span>${m.label}: <b>${m.value||'&mdash;'}</b></span>`).join('');
  return `<div class="kpi">
    <div class="kpi-label">${label}</div>
    <div class="kpi-nums"><span class="kpi-actual">${actual||'0'}</span><span class="kpi-target">/ ${target||'0'} target</span></div>
    <div class="pbar"><div class="pbar-fill" style="width:${width}%"></div></div>
    <div class="kpi-meta">${metaHtml}</div>
  </div>`;
}

function renderTeamOverview(summary){
  if(!summary) return `<div class="empty">No team overview data yet.<br><button id="emptyPasteBtn2" class="primary">Paste data</button></div>`;
  const kpis = summary.metrics.map(m => buildKpiCard(m.label, m.actual, m.target, [
    { label: 'To target', value: m.actualToTarget }
  ])).join('');
  const secondary = summary.secondary.map(s => buildKpiCard(s.label, s.actual, s.target, [
    { label: 'To target', value: s.actualToTarget }
  ])).join('');
  const ratios = summary.ratios.map(r => `<div class="ratio"><span class="rk">${r.label}</span><span class="rv">${r.value||'&mdash;'}</span></div>`).join('');
  return `
    <div class="kpis">${kpis}</div>
    ${secondary ? `<div class="kpis">${secondary}</div>` : ''}
    ${ratios ? `<div class="ratios" style="margin-bottom:20px">${ratios}</div>` : ''}
  `;
}

function render(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
  document.querySelectorAll('.viewtoggle span').forEach(v => v.classList.toggle('active', v.dataset.view === currentView));
  const content = document.getElementById('content');
  const lastUpdated = document.getElementById('lastUpdated');
  const statsRow = document.getElementById('statsRow');
  const controlsRow = document.getElementById('controlsRow');

  if(currentTab === 'tab1'){
    const parsed = store.tab1;
    renderStats(parsed);
    renderControls(parsed);
    if(!parsed){
      content.innerHTML = `<div class="empty">No rep data yet.<br><button id="emptyPasteBtn" class="primary">Paste data</button></div>`;
      const btn = document.getElementById('emptyPasteBtn');
      if(btn) btn.onclick = openModal;
      lastUpdated.textContent = 'No data yet';
      return;
    }
    content.innerHTML = currentView === 'cards' ? renderCards(parsed) : renderTable(parsed);
    lastUpdated.textContent = `${parsed.rows.length} reps loaded`;
  } else {
    statsRow.classList.add('hidden');
    controlsRow.classList.add('hidden');
    const summary = store.tab2;
    content.innerHTML = renderTeamOverview(summary);
    const btn2 = document.getElementById('emptyPasteBtn2');
    if(btn2) btn2.onclick = openModal;
    lastUpdated.textContent = summary ? 'Team overview loaded' : 'No data yet';
  }
}

function openModal(){
  document.getElementById('modalTitle').textContent = `Paste data — ${currentTab==='tab1'?'Reps':'Team overview'}`;
  document.getElementById('pasteArea').value = '';
  document.getElementById('modalErr').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modalOverlay').classList.add('hidden'); }

document.getElementById('refreshBtn').onclick = async () => {
  const btn = document.getElementById('refreshBtn');
  if(btn.classList.contains('spinning')) return; // already in progress, ignore extra clicks
  btn.classList.add('spinning');
  btn.disabled = true;
  document.getElementById('fetchBanner').innerHTML = '';
  try{
    await tryLiveFetch();
  }catch(e){
    console.error('Unexpected refresh error:', e);
    document.getElementById('fetchBanner').innerHTML = '<div class="banner banner-warn">Unexpected error during refresh: ' + e.message + '</div>';
  }finally{
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
  render();
};
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('saveBtn').onclick = async () => {
  const text = document.getElementById('pasteArea').value;
  const err = document.getElementById('modalErr');
  try{
    if(currentTab === 'tab1'){
      const parsed = applyHiddenColumns(parseRepTable(text));
      if(!parsed){ err.textContent = 'Could not find a "Rep Name" column. Make sure the header row is included.'; err.classList.remove('hidden'); return; }
      await saveData('tab1', parsed);
    } else {
      const parsed = parseTeamSummary(text);
      if(!parsed){ err.textContent = 'Could not read that data. Paste the full team overview section including labels.'; err.classList.remove('hidden'); return; }
      await saveData('tab2', parsed);
    }
    closeModal();
    render();
  }catch(e){
    err.textContent = 'Save failed. Please try again.';
    err.classList.remove('hidden');
  }
};

document.querySelectorAll('.tab').forEach(t => { t.onclick = () => { currentTab = t.dataset.tab; render(); }; });
document.querySelectorAll('.viewtoggle span').forEach(v => { v.onclick = () => { currentView = v.dataset.view; render(); }; });
document.getElementById('search').oninput = render;
document.getElementById('sortBy').onchange = render;

(async () => {
  try{
    const cached1raw = await storageGetRaw('tab1');
    if(cached1raw){
      const parsedCached = JSON.parse(cached1raw);
      if(parsedCached.headers && parsedCached.headers.some(h => HIDDEN_COLUMNS.map(x=>x.toLowerCase()).includes(h.toLowerCase()))){
        await saveData('tab1', applyHiddenColumns(parsedCached));
      }
    }
  }catch(e){}
  await loadCached();
  render();
  const initBtn = document.getElementById('refreshBtn');
  initBtn.classList.add('spinning');
  initBtn.disabled = true;
  try{
    await tryLiveFetch();
  }finally{
    initBtn.classList.remove('spinning');
    initBtn.disabled = false;
  }
  render();
})();
</script>
